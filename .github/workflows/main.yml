name: Build and Deploy

on:
  push:
    branches:
     - main
permissions: 
  id-token: write
  contents: read
env:
  ACR_NAME: zautomoilesappregisty
  IMAGE_NAME: z_automobile_backend
jobs:
  build_and_deploy:
    name: build_job
    runs-on: self-hosted
    steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: Azure Login
       uses: azure/login@v2
       with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
     - name: Check Azure Login
       run: |
         az account show
     - name: Build Image
       run: |
         docker build \
           -t $ACR_NAME.azurecr.io/z_automobile_backend:${{ github.sha }} .
     - name: Push Image
       run: |
         docker push \
           $ACR_NAME.azurecr.io/z_automobile_backend:${{ github.sha }}



   

