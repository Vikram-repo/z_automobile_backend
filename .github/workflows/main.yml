name: Build and Deploy

on:
  push:
    branches:
     - main
permissions: 
  id-token: write
  contents: read
jobs:
  build_and_deploy:
    name: build_job
    runs-on: zautomobileapp
    steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: Azure Login
       uses: azure/login@v2
       with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
     - name: Check Azure Login
       run: |
         az account show
    

